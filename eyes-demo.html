<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Unseen Eyes Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #170d02; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .eyes-container {
    width: 320px; height: 240px;
    transform: scale(0);
    animation: eyes-enter 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
  }
  @keyframes eyes-enter {
    to { transform: scale(1); }
  }

  .eyes-svg { width: 100%; height: 100%; }

  /* Eyelid animations */
  .eyelid { transition: transform 0.15s ease-in-out; }
  .eyelid-top { transform-origin: center top; }
  .eyelid-bottom { transform-origin: center bottom; }

  /* Blink state */
  .blinking .eyelid-top { transform: translateY(60px); }
  .blinking .eyelid-bottom { transform: translateY(-50px); }

  /* Heart hidden by default */
  .heart { opacity: 0; transition: opacity 0.3s; }
  .heart.visible { opacity: 1; }

  /* Pupil group transition */
  .pupil-group { transition: transform 0.08s ease-out; }
</style>
</head>
<body>

<div class="eyes-container">
  <svg class="eyes-svg" viewBox="0 0 311.3 233.3" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- clipPath for left eye -->
      <clipPath id="clip-left">
        <path d="M139.5,101.5c2.5-7.8,6-14.8,10.3-21c0-0.1-0.1-0.2-0.1-0.3c-3.8-11.2-11.1-19-20.6-22c-2.8-0.9-5.6-1.3-8.5-1.3c-7,0-14.2,2.5-21,7.5C89.8,71.3,82.2,82.4,78,95.5c-4.1,13.1-4.3,26.5-0.4,37.9c3.8,11.2,11.1,19,20.6,22c9.4,3,19.9,0.8,29.5-6.1c3.5-2.5,6.7-5.6,9.6-9.1C134.6,128,135.3,114.6,139.5,101.5z"/>
      </clipPath>
      <!-- clipPath for right eye -->
      <clipPath id="clip-right">
        <path d="M206,58.9c-3.8-1.2-7.6-1.8-11.4-1.8c-21.7,0-43.6,18.2-52.2,45.3c-4.9,15.5-4.8,31.6,0.3,45.3c5.1,13.6,14.5,23.1,26.6,27c12,3.8,25.3,1.4,37.2-6.7c12.1-8.2,21.5-21.3,26.4-36.8C243,99.2,230.9,66.8,206,58.9z"/>
      </clipPath>
    </defs>

    <!-- ===== LEFT EYE ===== -->
    <!-- Eye white outline -->
    <ellipse transform="matrix(0.3023 -0.9532 0.9532 0.3023 -22.508 182.8248)"
      fill="#fff" stroke="#000" stroke-width="3" cx="113.6" cy="106.8" rx="52.5" ry="38.8"/>

    <g clip-path="url(#clip-left)">
      <!-- Pupil group (moves with mouse) -->
      <g class="pupil-group" id="pupil-left">
        <!-- Iris -->
        <ellipse transform="matrix(0.2938 -0.9559 0.9559 0.2938 -24.3184 186.5732)"
          fill="#fff" cx="114.1" cy="109.7" rx="33" ry="23.5"/>
        <!-- Pupil (dark) -->
        <circle fill="#000" cx="132.6" cy="120.7" r="11"/>
        <!-- Highlight -->
        <circle fill="#fff" cx="138" cy="114" r="4"/>
      </g>
      <!-- Heart (hidden, shows on hover) -->
      <path class="heart" id="heart-left" fill="#FF4E1B"
        d="M131.8,98.8c-0.9-2.8-3-5.3-5.8-6.2c-4.1-1.3-9.1,1.2-11.5,4.6c-1.5,2.1-2.1,4.6-2.9,7c-0.2,0.8-0.8,4-1.8,2.2c-2.2-3.7-6.4-6.2-10.7-4.7c-3.2,1.1-5.2,4.3-5.9,7.4c-1,5,1.4,9.9,4.9,13.4c2.6,2.6,5.7,4.6,8.9,6.5c1.7,1,3.6,1.7,5.2,2.8c1.4,1,4.1,5.8,5.4,3.1c1.1-2.4,1.6-5.1,3-7.4c1.5-2.6,3.4-5,5.1-7.5c3.3-4.7,6.8-9.8,6.9-15.8C132.7,102.5,132.5,100.6,131.8,98.8z"/>
      <!-- Eyelids -->
      <rect class="eyelid eyelid-top" id="eyelid-left-top" fill="#F8D8D8" stroke="#000" stroke-width="3"
        x="62.9" y="22.3" width="103.2" height="78.5"/>
      <rect class="eyelid eyelid-bottom" id="eyelid-left-bottom" fill="#F8D8D8" stroke="#000" stroke-width="3"
        x="65.1" y="125.7" width="89.3" height="78.5"/>
    </g>

    <!-- ===== RIGHT EYE ===== -->
    <!-- Eye white outline -->
    <ellipse transform="matrix(0.3023 -0.9532 0.9532 0.3023 19.5634 260.2873)"
      fill="#fff" stroke="#000" stroke-width="3" cx="187.6" cy="116.8" rx="62.3" ry="49"/>

    <g clip-path="url(#clip-right)">
      <!-- Pupil group (moves with mouse) -->
      <g class="pupil-group" id="pupil-right">
        <!-- Iris -->
        <ellipse transform="matrix(0.2938 -0.9559 0.9559 0.2938 23.4151 259.1791)"
          fill="#fff" cx="187.1" cy="113.7" rx="35.9" ry="25.6"/>
        <!-- Pupil (dark) -->
        <circle fill="#000" cx="208.6" cy="121.7" r="11"/>
        <!-- Highlight -->
        <circle fill="#fff" cx="214" cy="115" r="4"/>
      </g>
      <!-- Heart (hidden, shows on hover) -->
      <path class="heart" id="heart-right" fill="#FF4E1B"
        d="M158.8,104.8c0.1-7,5.7-13.4,13.1-12.3c2.6,0.4,4.9,1.7,6.8,3.4c1.2,1.1,4,7.1,5.5,4.2c2.4-4.8,7.4-9,12.8-9.9c6.5-1.1,11.6,3.8,12.9,9.9c1.6,7.7-3.9,14.6-8.8,19.9c-5.7,6.1-12.8,11.8-15.3,20c-1.5,4.8-3.8-0.8-5.1-2.8c-1.7-2.6-4-4.7-6.3-6.7c-4.7-4.3-10-8.5-12.9-14.3C160,113,158.8,108.8,158.8,104.8z"/>
      <!-- Eyelids -->
      <rect class="eyelid eyelid-top" id="eyelid-right-top" fill="#F8D8D8" stroke="#000" stroke-width="3"
        x="130.6" y="22.3" width="117.6" height="78.5"/>
      <rect class="eyelid eyelid-bottom" id="eyelid-right-bottom" fill="#F8D8D8" stroke="#000" stroke-width="3"
        x="127.5" y="125.7" width="117.6" height="78.5"/>
    </g>
  </svg>
</div>

<script>
(function() {
  var pupilL = document.getElementById('pupil-left');
  var pupilR = document.getElementById('pupil-right');
  var heartL = document.getElementById('heart-left');
  var heartR = document.getElementById('heart-right');
  var eyelidLT = document.getElementById('eyelid-left-top');
  var eyelidLB = document.getElementById('eyelid-left-bottom');
  var eyelidRT = document.getElementById('eyelid-right-top');
  var eyelidRB = document.getElementById('eyelid-right-bottom');
  var container = document.querySelector('.eyes-container');

  // Eye centers (from SVG)
  var leftCenter = { x: 132.6, y: 120.7 };
  var rightCenter = { x: 208.6, y: 121.7 };
  var maxMove = 12;

  // Mouse tracking
  var mouseX = 0.5, mouseY = 0.5;

  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX / window.innerWidth;
    mouseY = e.clientY / window.innerHeight;
  });

  // Pupil follow mouse
  function updatePupils() {
    var dx = (mouseX - 0.5) * 2;
    var dy = (mouseY - 0.5) * 2;
    var tx = dx * maxMove;
    var ty = dy * maxMove;
    pupilL.setAttribute('transform', 'translate(' + tx + ',' + ty + ')');
    pupilR.setAttribute('transform', 'translate(' + tx + ',' + ty + ')');
    requestAnimationFrame(updatePupils);
  }
  updatePupils();

  // Auto blink
  function blink() {
    // Close eyes
    eyelidLT.style.transform = 'translateY(60px)';
    eyelidLB.style.transform = 'translateY(-50px)';
    eyelidRT.style.transform = 'translateY(60px)';
    eyelidRB.style.transform = 'translateY(-50px)';

    // Open eyes after 150ms
    setTimeout(function() {
      eyelidLT.style.transform = 'translateY(0)';
      eyelidLB.style.transform = 'translateY(0)';
      eyelidRT.style.transform = 'translateY(0)';
      eyelidRB.style.transform = 'translateY(0)';
    }, 150);

    // Next blink in 3-5 seconds
    setTimeout(blink, 3000 + Math.random() * 2000);
  }
  // Start blinking after 2 seconds
  setTimeout(blink, 2000);

  // Heart on hover
  container.addEventListener('mouseenter', function() {
    heartL.classList.add('visible');
    heartR.classList.add('visible');
    pupilL.style.opacity = '0';
    pupilR.style.opacity = '0';
  });

  container.addEventListener('mouseleave', function() {
    heartL.classList.remove('visible');
    heartR.classList.remove('visible');
    pupilL.style.opacity = '1';
    pupilR.style.opacity = '1';
  });
})();
</script>

</body>
</html>
