<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in the Void | YZT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --text: #e8e8e8; --accent: #00d4ff;
      --mono: 'JetBrains Mono', monospace; --sans: 'Space Grotesk', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { position: fixed; inset: 0; z-index: 0; }
    .content { position: relative; z-index: 1; text-align: center; padding: 40px; }
    .glitch { font-size: clamp(80px, 15vw, 160px); font-weight: 700; letter-spacing: 8px; position: relative; margin-bottom: 24px; }
    .glitch::before, .glitch::after { content: '404'; position: absolute; top: 0; left: 0; }
    .glitch::before { color: var(--accent); clip-path: inset(0 0 60% 0); animation: g1 3s infinite; }
    .glitch::after { color: #7b61ff; clip-path: inset(40% 0 0 0); animation: g2 3s infinite; }
    @keyframes g1 { 0%,90%,100%{transform:translate(0)} 92%{transform:translate(-4px,2px)} 94%{transform:translate(4px,-1px)} 96%{transform:translate(-2px,-2px)} }
    @keyframes g2 { 0%,90%,100%{transform:translate(0)} 92%{transform:translate(4px,-2px)} 94%{transform:translate(-4px,1px)} 96%{transform:translate(2px,2px)} }
    p { font-size: 18px; color: rgba(255,255,255,0.5); margin-bottom: 40px; }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: var(--accent); color: #000; font-family: var(--sans); font-size: 14px; font-weight: 600; border-radius: 100px; text-decoration: none; transition: all 0.3s; }
    a:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,212,255,0.3); }
    .term { font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,0.3); margin-top: 32px; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="content">
    <div class="glitch">404</div>
    <p>This page doesn't exist. Or does it?<br>Maybe it's just <span style="color:var(--accent)">[REDACTED]</span>.</p>
    <a href="/">← Return to Base</a>
    <div class="term">
      $ curl -I /lost-page<br>
      HTTP/1.1 404 Not Found<br>
      X-Void-Status: EMPTY<br>
      X-Secret: try the konami code
    </div>
  </div>
  <script>
    const c = document.getElementById('bg');
    const ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const cols = Math.floor(c.width / 14);
    const drops = new Array(cols).fill(1);
    const chars = '01アイウエオカキクケコサシスセソ';
    function draw() {
      ctx.fillStyle = 'rgba(10,10,15,0.05)';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#00d4ff';
      ctx.font = '14px JetBrains Mono';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 14, drops[i] * 14);
        if (drops[i] * 14 > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(draw);
    }
    draw();
    addEventListener('resize', () => { c.width = innerWidth; c.height = innerHeight; });
  </script>
</body>
</html>
